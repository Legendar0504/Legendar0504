<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="EVA-02 · Legendar0504">
  <defs>
    <pattern id="hex" width="28" height="48.5" patternUnits="userSpaceOnUse" patternTransform="scale(1.2)">
      <path d="M14 0 L28 8.08 L28 24.25 L14 32.33 L0 24.25 L0 8.08 Z M14 32.33 L14 48.5" fill="none" stroke="#3a0d0b" stroke-width="1"/>
    </pattern>
    <pattern id="caution" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="20" height="40" fill="#F28C28"/>
      <rect x="20" width="20" height="40" fill="#0B0B0D"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#0B0B0D" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#0B0B0D" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0B0B0D"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF3B2F"/>
      <stop offset="1" stop-color="#A4120C"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="320" rx="14"/></clipPath>
    <style>
      .serif { font-family: "Times New Roman", "Noto Serif", Georgia, serif; font-weight: 900; }
      .hud   { font-family: "Consolas", "Courier New", monospace; letter-spacing: 2px; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .scan  { animation: scan 4s linear infinite; }
      @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(340px); } }
      .sync  { animation: sync 3.2s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: left center; }
      @keyframes sync { from { transform: scaleX(0.35); } to { transform: scaleX(1); } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .8; } 50% { opacity: 1; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#0B0B0D"/>
    <rect width="1200" height="320" fill="url(#hex)"/>

    <!-- красный клин слева, как броня Евы-02 -->
    <path d="M0 0 H330 L230 320 H0 Z" fill="url(#red)"/>
    <path d="M330 0 H352 L252 320 H230 Z" fill="#F28C28"/>
    <path d="M0 0 H330 L230 320 H0 Z" fill="url(#hex)" opacity=".35"/>

    <!-- «глаза» Евы-02 -->
    <g class="pulse">
      <rect x="58" y="118" width="64" height="12" rx="6" fill="#7CFFB2"/>
      <rect x="140" y="118" width="64" height="12" rx="6" fill="#7CFFB2"/>
      <rect x="99" y="142" width="64" height="12" rx="6" fill="#7CFFB2" opacity=".75"/>
    </g>
    <text x="40" y="232" class="serif" font-size="74" fill="#0B0B0D" transform="scale(1 1)">02</text>
    <text x="42" y="262" class="hud" font-size="13" fill="#0B0B0D">PRODUCTION MODEL</text>

    <!-- титр в стиле Евангелиона -->
    <text x="400" y="78" class="hud" font-size="15" fill="#F28C28">EVANGELION UNIT-02</text>
    <g transform="translate(398 168) scale(0.78 1)">
      <text class="serif" font-size="96" fill="#F4F1EA">LEGENDAR</text>
    </g>
    <g transform="translate(818 168) scale(0.78 1)">
      <text class="serif" font-size="96" fill="#FF3B2F">0504</text>
    </g>
    <rect x="400" y="186" width="560" height="3" fill="#F4F1EA"/>
    <text x="400" y="222" class="hud" font-size="18" fill="#F28C28">WEB · MAPS · BOTS</text>

    <!-- HUD справа снизу -->
    <text x="400" y="266" class="hud" font-size="13" fill="#9a9a9a">SYNC RATIO</text>
    <rect x="510" y="256" width="300" height="12" fill="#2a0b09" stroke="#FF3B2F" stroke-width="1"/>
    <rect x="510" y="256" width="300" height="12" fill="#FF3B2F" class="sync"/>
    <text x="824" y="267" class="hud" font-size="13" fill="#FF3B2F">400%</text>
    <text x="1040" y="78" class="hud blink" font-size="15" fill="#7CFFB2">● ACTIVE</text>
    <text x="1040" y="100" class="hud" font-size="11" fill="#666">NERV-JP / 2015</text>

    <!-- сканирующая линия -->
    <rect class="scan" x="0" y="0" width="1200" height="2" fill="#FF3B2F" opacity=".25"/>

    <!-- сигнальная лента -->
    <rect x="0" y="296" width="1200" height="24" fill="url(#caution)"/>
    <rect x="0" y="292" width="1200" height="4" fill="#0B0B0D"/>
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="14" fill="none" stroke="#FF3B2F" stroke-width="2"/>
</svg>
