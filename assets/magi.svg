<svg xmlns="http://www.w3.org/2000/svg" width="320" height="420" viewBox="0 0 320 420" role="img" aria-label="MAGI system">
  <defs>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0 H0 V16" fill="none" stroke="#2a1606" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: Consolas, "Courier New", monospace; letter-spacing: 1.5px; }
      .unit { fill: #160c03; stroke: #F28C28; stroke-width: 2; animation: vote 4.5s infinite; }
      .u2 { animation-delay: 1.5s; }
      .u3 { animation-delay: 3s; }
      @keyframes vote { 0%, 60%, 100% { fill: #160c03; } 10%, 40% { fill: #F28C28; } }
      .lbl { fill: #F28C28; animation: lbl 4.5s infinite; }
      .l2 { animation-delay: 1.5s; }
      .l3 { animation-delay: 3s; }
      @keyframes lbl { 0%, 60%, 100% { fill: #F28C28; } 10%, 40% { fill: #160c03; } }
      .blink { animation: blink 1.2s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="320" height="420" rx="10" fill="#0B0B0D"/>
  <rect width="320" height="420" rx="10" fill="url(#grid)"/>
  <rect x="1" y="1" width="318" height="418" rx="10" fill="none" stroke="#F28C28" stroke-width="2"/>

  <!-- заголовок -->
  <rect x="16" y="16" width="288" height="34" fill="#F28C28"/>
  <text x="160" y="39" text-anchor="middle" class="mono" font-size="16" font-weight="700" fill="#0B0B0D">MAGI SYSTEM</text>
  <text x="16" y="70" class="mono" font-size="10" fill="#9a6a3a">CODE: 0504   PRIORITY: AAA</text>

  <!-- BALTHASAR-2: сверху -->
  <polygon class="unit u2" points="100,88 220,88 244,112 244,170 76,170 76,112"/>
  <text class="mono lbl l2" x="160" y="126" text-anchor="middle" font-size="14" font-weight="700">BALTHASAR</text>
  <text class="mono lbl l2" x="160" y="148" text-anchor="middle" font-size="22" font-weight="700">· 2 ·</text>

  <!-- CASPER-3: слева -->
  <polygon class="unit u3" points="16,190 136,190 152,206 152,290 40,290 16,266"/>
  <text class="mono lbl l3" x="84" y="232" text-anchor="middle" font-size="14" font-weight="700">CASPER</text>
  <text class="mono lbl l3" x="84" y="256" text-anchor="middle" font-size="22" font-weight="700">· 3 ·</text>

  <!-- MELCHIOR-1: справа -->
  <polygon class="unit" points="168,206 184,190 304,190 304,266 280,290 168,290"/>
  <text class="mono lbl" x="236" y="232" text-anchor="middle" font-size="14" font-weight="700">MELCHIOR</text>
  <text class="mono lbl" x="236" y="256" text-anchor="middle" font-size="22" font-weight="700">· 1 ·</text>

  <!-- соединения -->
  <path d="M120 170 L100 190 M200 170 L220 190 M152 248 H168" stroke="#F28C28" stroke-width="2"/>

  <!-- итог -->
  <rect x="16" y="312" width="288" height="40" fill="none" stroke="#FF3B2F" stroke-width="2"/>
  <text x="160" y="338" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#FF3B2F">RESOLUTION: APPROVED</text>
  <text x="16" y="378" class="mono" font-size="10" fill="#9a6a3a">USER   LEGENDAR0504</text>
  <text x="16" y="396" class="mono blink" font-size="10" fill="#7CFFB2">● ACCESS GRANTED</text>
  <text x="304" y="396" text-anchor="end" class="mono" font-size="10" fill="#9a6a3a">NERV · 2015</text>
</svg>
